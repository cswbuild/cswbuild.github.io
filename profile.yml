intro: >-
  I am a Ph.D. candidate in Computer Science at Harvard University, advised by
  Prof. Elena L. Glassman in the Variation Lab. I design and evaluate
  interactive systems that support human sensemaking and judgment when working
  with AI. My research investigates AI-resilient interfaces: approaches that help
  people notice, judge, and recover from potentially inappropriate AI behavior.
background: >-
  My work spans human–AI interaction, theories of human cognition and concept
  learning, large language model interfaces, scientific communication, and legal
  reading and writing. I previously earned an M.Sc. in Electrical Engineering
  from Carnegie Mellon University and a B.Sc. in Mathematics from Mississippi
  State University.
